[workspace]
resolver = "2"
members = [
    "engine_core",
    "game_core",
    "protocol",
    "content",
    "server",
    "client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = "=0.19.0"
bevy_ecs = "=0.19.0"
serde = { version = "=1.0.229", features = ["derive"] }
ron = { version = "=0.12.2", features = ["integer128"] }
bevy_replicon = "=0.41.1"
bevy_replicon_renet = "=0.17.0"
bevy_app = "=0.19.0"
# Client-only: renders Tiled maps. default-features = false here because the
# server must never link it — see CLAUDE.md's feature-unification note and
# MECHANICS.md-adjacent ROADMAP.md M3.5 entry for why.
bevy_ecs_tiled = { version = "=0.13.3", default-features = false }
# Server-only: physics/collision backend for map colliders. default-features
# = false because avian2d's own defaults pull in bevy_render via
# "debug-plugin" — see CLAUDE.md's feature-unification note.
avian2d = { version = "=0.7.0", default-features = false }
# Server-only: plain (non-Bevy) Tiled map parser, used to extract collider
# geometry without depending on bevy_ecs_tiled (which hard-depends on
# bevy_render regardless of features — see CLAUDE.md).
tiled = "=0.16.0"
# game_core only: crit rolls (and later loot table rolls). Combat-resolution
# functions take a generic `rng: &mut impl Rng` so tests can inject a seeded
# RNG for deterministic assertions.
rand = "=0.10.2"
# Client-only: HUD/menu UI (CLAUDE.md's stack from the start). The server
# must never link it — no rendering dependencies on the headless binary.
bevy_egui = "=0.41.1"
# Client-only: 2D dynamic lighting/shadows (M8.5), needed before real art
# lands so sprite/tile colors can be chosen against real lighting. The
# server must never link it — purely cosmetic, no gameplay effect to
# authorize or keep in sync.
bevy_lit = "=0.11.0"
# Client-only: GPU particle effects (M8.5) — sparks/glow ambience. The
# server must never link it — purely cosmetic, same reasoning as bevy_lit.
# default-features = false + the "2d" feature: this project has no 3D
# rendering at all, and bevy_hanabi's default features are 3D-oriented.
bevy_hanabi = { version = "=0.19.0", default-features = false, features = ["2d"] }
# game_core only: lightweight logging facade for toggleable debug/trace
# instrumentation (see DECISIONS.md) — just the `tracing` macros, no
# subscriber/backend, so this stays a thin, engine-agnostic dependency.
# `server` (and later `client`) already links the full `tracing-subscriber`
# transitively via `bevy::log::LogPlugin`, which is what actually renders
# these events and applies `RUST_LOG` filtering; pinned to the exact version
# already resolved transitively in Cargo.lock so no duplicate version gets
# pulled in.
tracing = "=0.1.44"
